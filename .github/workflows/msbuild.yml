name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      - name: Clone plugin-sdk
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git C:\plugin-sdk

      - name: Generate plugin-sdk project files
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=C:\plugin-sdk
          "C:\plugin-sdk\tools\generate\Visual Studio.bat"

      - name: Build plugin-sdk (ReleaseSA + DebugSA)
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=C:\plugin-sdk
          msbuild C:\plugin-sdk\plugin.sln /property:Configuration=ReleaseSA /property:Platform=Win32 /m /nologo /verbosity:minimal
          msbuild C:\plugin-sdk\plugin.sln /property:Configuration=DebugSA /property:Platform=Win32 /m /nologo /verbosity:minimal

      - name: Generate EarShot project files
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          set PLUGIN_SDK_DIR=C:\plugin-sdk
          "C:\plugin-sdk\tools\generate\Visual Studio.bat"

      - name: Build EarShot (ReleaseSA)
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          set PLUGIN_SDK_DIR=C:\plugin-sdk
          msbuild project_files\EarShotOpenAL.sln /property:Configuration=ReleaseSA /property:Platform=Win32 /m /nologo /verbosity:minimal

      - name: Find and upload EarShot.asi
        shell: pwsh
        run: |
          $asi = Get-ChildItem -Recurse -Filter "EarShot.asi" | Select-Object -First 1
          if (-not $asi) { Write-Error "EarShot.asi not found"; exit 1 }
          echo "ASI_PATH=$($asi.FullName)" >> $env:GITHUB_ENV
          Write-Host "Found: $($asi.FullName)"

      - name: Upload EarShot.asi
        uses: actions/upload-artifact@v4
        with:
          name: EarShot-${{ github.sha }}
          path: ${{ env.ASI_PATH }}
          if-no-files-found: error
