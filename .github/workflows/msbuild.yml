name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── MSVC (x86) ──────────────────────────────────────────────────────────
      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # ── premake5 beta8 (supports vs2026) ────────────────────────────────────
      - name: Install premake5
        uses: Jarod42/install-premake5@v7

      # ── plugin-sdk ──────────────────────────────────────────────────────────
      - name: Clone plugin-sdk
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git C:\plugin-sdk

      # ── Environment variable expected by premake5.lua ──────────────────────
      - name: Set PLUGIN_SDK_DIR
        run: |
          echo "PLUGIN_SDK_DIR=C:\plugin-sdk" >> $env:GITHUB_ENV

      # ── Generate plugin-sdk solution ────────────────────────────────────────
      - name: Generate plugin-sdk project files
        shell: cmd
        working-directory: C:\plugin-sdk\tools\generate
        run: |
          call "Visual Studio.bat"

      # ── Build plugin-sdk ────────────────────────────────────────────────────
      - name: Build plugin-sdk (ReleaseSA)
        working-directory: C:\plugin-sdk
        run: |
          msbuild project_files\plugin-sdk.sln `
            /p:Configuration=ReleaseSA `
            /p:Platform=Win32 `
            /m /nologo /verbosity:minimal

      - name: Build plugin-sdk (DebugSA)
        working-directory: C:\plugin-sdk
        run: |
          msbuild project_files\plugin-sdk.sln `
            /p:Configuration=DebugSA `
            /p:Platform=Win32 `
            /m /nologo /verbosity:minimal

      # ── Generate EarShot solution ───────────────────────────────────────────
      - name: Generate project files
        run: premake5 vs2026

      # ── Build EarShot ───────────────────────────────────────────────────────
      - name: Build EarShot (ReleaseSA)
        run: |
          msbuild project_files\EarShotOpenAL.sln `
            /p:Configuration=ReleaseSA `
            /p:Platform=Win32 `
            /m /nologo /verbosity:minimal

      # ── Locate artifact ─────────────────────────────────────────────────────
      - name: Find EarShot.asi
        run: |
          $asi = Get-ChildItem -Path . -Recurse -Filter EarShot.asi |
            Select-Object -First 1

          if (-not $asi) {
            Write-Error "EarShot.asi not found after build"
            exit 1
          }

          "ASI_PATH=$($asi.FullName)" >> $env:GITHUB_ENV
          Write-Host "Found: $($asi.FullName)"

      # ── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload EarShot.asi
        uses: actions/upload-artifact@v4
        with:
          name: EarShot-${{ github.sha }}
          path: ${{ env.ASI_PATH }}
          if-no-files-found: error
