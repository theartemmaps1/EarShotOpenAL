name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    defaults:
      run:
        shell: cmd
        working-directory: ${{ github.workspace }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── MSVC ────────────────────────────────────────────────────────────────
      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # ── premake ────────────────────────────────────────────────────────────
      - name: Install premake5
        uses: Jarod42/install-premake5@v7

      # ── plugin-sdk ──────────────────────────────────────────────────────────
      - name: Clone plugin-sdk
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git C:\plugin-sdk

      - name: Set PLUGIN_SDK_DIR
        run: echo PLUGIN_SDK_DIR=C:\plugin-sdk >> %GITHUB_ENV%

      # ── Generate plugin-sdk solution ────────────────────────────────────────
      - name: Generate plugin-sdk project files
        working-directory: C:\plugin-sdk\tools\generate
        run: |
          call "Visual Studio.bat"

      # ── Build plugin-sdk (official configuration) ───────────────────────────
      - name: Build plugin-sdk
        working-directory: C:\plugin-sdk
        run: |
          msbuild plugin.sln ^
            /p:Configuration=Release ^
            /p:Platform="Win32" ^
            /target:plugin_sa ^
            /m ^
            /verbosity:minimal

      # ── Generate your project ───────────────────────────────────────────────
      - name: Generate EarShot project files
        run: premake5 vs2026

      # ── Build EarShot ───────────────────────────────────────────────────────
      - name: Build EarShot (ReleaseSA)
        run: |
          msbuild project_files\EarShotOpenAL.sln ^
            /p:Configuration=ReleaseSA ^
            /p:Platform=Win32 ^
            /m ^
            /verbosity:minimal

      # ── Find output ─────────────────────────────────────────────────────────
      - name: Find EarShot.asi
        run: |
          for /r %%i in (EarShot.asi) do (
            echo ASI_PATH=%%i>> %GITHUB_ENV%
            goto done
          )
          :done

      # ── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload EarShot.asi
        uses: actions/upload-artifact@v4
        with:
          name: EarShot-${{ github.sha }}
          path: ${{ env.ASI_PATH }}
          if-no-files-found: error
